name: limusic
base: core26
version: '1.3.0'
title: LiMusic
icon: snap/gui/limusic.png
summary: YouTube Music and local music with lyrics and gapless playback
description: |
  LiMusic is a desktop music player with YouTube Music search, playlists,
  local music, gapless playback, synced lyrics, music videos, custom themes
  and ListenBrainz scrobbling. Sign in to access your YouTube Music library.

  This strictly confined snap stores its own settings and music library.
  Last.fm integration and launch at login are unavailable in this package.
  Application updates are managed by the Snap Store.
license: GPL-3.0-or-later
grade: stable
confinement: strict
website: https://limusic.app
source-code:
  - https://github.com/SimoHypers/limusic
  - https://github.com/sidalit/limusic-snap
issues:
  - https://github.com/SimoHypers/limusic/issues
  - https://github.com/sidalit/limusic-snap/issues
contact: https://github.com/sidalit/limusic-snap/issues

platforms:
  amd64:
  arm64:

slots:
  mpris:
    interface: mpris
  single-instance:
    interface: dbus
    bus: session
    name: com.limusic.desktop.SingleInstance

apps:
  limusic:
    command: bin/limusic-app
    extensions: [gnome]
    slots:
      - mpris
      - single-instance
    plugs:
      - audio-playback
      - home
      - network
      - network-bind
      - network-status
      - removable-media
      - screen-inhibit-control
      - unity7

parts:
  frontend-tools:
    plugin: nil
    build-snaps:
      - node/22/stable
    override-build: |
      npm install --global --prefix "$CRAFT_PART_INSTALL" pnpm@10 @tauri-apps/cli@2.11.5
    prime: ['-*']

  limusic:
    plugin: rust
    source: https://github.com/SimoHypers/limusic.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    source-depth: 1
    rust-channel: stable
    rust-ignore-toolchain-file: true
    after: [frontend-tools]
    build-environment:
      - PATH: $CRAFT_STAGE/bin:$PATH
      - CARGO_BUILD_JOBS: $CRAFT_PARALLEL_BUILD_COUNT
      - VITE_SNAP: '1'
    build-packages:
      - build-essential
      - clang
      - cmake
      - libclang-dev
      - libdbus-1-dev
      - libmpv-dev
      - libssl-dev
      - patch
      - pkg-config
    stage-packages:
      - gstreamer1.0-libav
      - libmpv2
    override-pull: |
      craftctl default
      patch -p1 < "$CRAFT_PROJECT_DIR/snap/local/strict-desktop.patch"
    override-build: |
      pnpm --dir ui install --frozen-lockfile
      pnpm --dir ui build
      tauri build --no-bundle \
        --config '{"build":{"beforeBuildCommand":""},"plugins":{"updater":{"endpoints":[]}}}' \
        -- --locked

      install -Dm755 target/release/limusic-app "$CRAFT_PART_INSTALL/bin/limusic-app"
      install -Dm644 "$CRAFT_PROJECT_DIR/snap/gui/limusic.png" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/limusic-app.png"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/limusic/LICENSE"
    prime:
      - -usr/share/man
